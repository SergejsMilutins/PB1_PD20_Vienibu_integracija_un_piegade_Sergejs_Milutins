name: Python CI + Docker

on:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Test stage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pielikumi/projekts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  docker-build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t pb1-app:v1.0.0 ./pielikumi/projekts